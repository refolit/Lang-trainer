<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор 5 цветов — Language Trainer</title>
<style>
  :root{ --ink:#1d1c1a; --mut:#6b7280; --line:#e8e2d8; --bg:#f7f4ef; --card:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); padding:24px 16px 60px; }
  .wrap{ max-width:820px; margin:0 auto; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--mut); font-size:14px; margin:0 0 20px; }

  /* Живой пример */
  .preview{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 18px 22px; box-shadow:0 6px 16px rgba(30,28,26,.06); position:sticky; top:12px; z-index:5; }
  .preview .p-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin-bottom:10px; }
  .card{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .hanzi{ font-size:46px; font-weight:700; }
  .py{ font-size:26px; font-weight:600; }
  .tr{ font-size:20px; }
  .btns{ display:flex; gap:10px; margin-top:16px; }
  .btn{ padding:10px 18px; border-radius:10px; font-size:15px; font-weight:600; border:1px solid transparent; cursor:default; }
  .btn.inactive{ color:#8a847c; }
  .btn.active{ color:#fff; }

  /* Секции выбора */
  .role{ margin:26px 0; }
  .role h2{ font-size:15px; margin:0 0 10px; }
  .swatches{ display:flex; flex-wrap:wrap; gap:10px; }
  .sw{ width:56px; height:56px; border-radius:12px; cursor:pointer; border:2px solid rgba(0,0,0,.08); position:relative; transition:transform .08s; }
  .sw:hover{ transform:scale(1.06); }
  .sw.sel{ outline:3px solid #1565c0; outline-offset:2px; }
  .sw .hex{ position:absolute; left:0; right:0; bottom:-20px; font-size:10px; text-align:center; color:var(--mut); }
  .role .sw-wrap{ padding-bottom:22px; }

  .out{ margin-top:30px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .out .o-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin-bottom:8px; }
  .out code{ font-size:14px; line-height:1.9; word-break:break-all; }
  .copy{ margin-top:12px; padding:10px 18px; border-radius:10px; background:#1565c0; color:#fff; border:none; font-size:15px; font-weight:600; cursor:pointer; }
  .copy:active{ transform:scale(.98); }
  .hint{ font-size:13px; color:var(--mut); margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Выбор 5 цветов (режим «Стандартный»)</h1>
  <p class="sub">Кликайте по квадратику в каждой строке — живой пример сверху сразу перекрасится. Потом нажмите «Скопировать мой выбор» и вставьте его мне.</p>

  <div class="preview">
    <div class="p-label">Живой пример</div>
    <div class="card">
      <span class="hanzi" id="pv-hanzi">你</span>
      <span class="py" id="pv-py">nǐ</span>
      <span class="tr" id="pv-tr">ты</span>
    </div>
    <div class="btns">
      <span class="btn inactive" id="pv-inactive">Неактивная кнопка</span>
      <span class="btn active" id="pv-active">Активная кнопка</span>
    </div>
  </div>

  <div id="roles"></div>

  <div class="out">
    <div class="o-label">Мой выбор</div>
    <code id="out"></code>
    <br>
    <button class="copy" id="copy">Скопировать мой выбор</button>
    <div class="hint" id="copy-hint"></div>
  </div>
</div>

<script>
  const ROLES = [
    { key:'hanzi',    label:'1. Иероглифы (основной текст)', options:['#1d1c1a','#111827','#0f172a','#27272a','#c62828','#2563eb','#7c3aed','#0d9488','#d97706','#059669','#db2777'] },
    { key:'pinyin',   label:'2. Пиньинь / транскрипция',      options:['#d97706','#2563eb','#0d9488','#b7791f','#7c3aed','#c2410c','#059669','#db2777','#e11d48','#0891b2','#9333ea','#ca8a04','#16a34a'] },
    { key:'trans',    label:'3. Перевод',                      options:['#6b7280','#8a847c','#9ca3af','#64748b','#78716c','#0ea5e9','#14b8a6','#f59e0b','#ec4899','#8b5cf6','#22c55e','#ef4444'] },
    { key:'inactive', label:'4. Неактивные кнопки (фон)',     options:['#f3f4f6','#f0ece4','#e5e7eb','#f1f5f9','#e7e5e4','#fef3c7','#dbeafe','#dcfce7','#fce7f3','#ede9fe','#cffafe'] },
    { key:'active',   label:'5. Активные кнопки (фон)',       options:['#c62828','#2563eb','#d97706','#0d9488','#16a34a','#7c3aed','#db2777','#e11d48','#0891b2','#ca8a04'] }
  ];

  const sel = {
    hanzi:'#1d1c1a', pinyin:'#d97706', trans:'#6b7280',
    inactive:'#f3f4f6', active:'#c62828'
  };

  function apply(){
    const h = document.getElementById('pv-hanzi');
    h.style.color = sel.hanzi;
    document.getElementById('pv-py').style.color = sel.pinyin;
    document.getElementById('pv-tr').style.color = sel.trans;
    const bi = document.getElementById('pv-inactive');
    bi.style.background = sel.inactive;
    // тёмный фон -> светлый текст, светлый фон -> тёмный текст
    const lum = c => { const x=parseInt(c.slice(1),16); const r=x>>16,g=(x>>8)&255,b=x&255; return (0.299*r+0.587*g+0.114*b); };
    bi.style.color = lum(sel.inactive) < 140 ? '#fff' : '#8a847c';
    const ba = document.getElementById('pv-active');
    ba.style.background = sel.active;
    ba.style.color = lum(sel.active) < 140 ? '#fff' : '#1d1c1a';
    document.getElementById('out').textContent =
      'иероглифы='+sel.hanzi+'  пиньинь='+sel.pinyin+'  перевод='+sel.trans+
      '  неактивная='+sel.inactive+'  активная='+sel.active;
  }

  const rolesEl = document.getElementById('roles');
  ROLES.forEach(r => {
    const sec = document.createElement('div');
    sec.className = 'role';
    sec.innerHTML = '<h2>'+r.label+'</h2><div class="swatches"></div>';
    const wrap = sec.querySelector('.swatches');
    r.options.forEach(hex => {
      const sw = document.createElement('div');
      sw.className = 'sw';
      sw.style.background = hex;
      sw.title = hex;
      sw.innerHTML = '<span class="hex">'+hex+'</span>';
      const holder = document.createElement('div');
      holder.className = 'sw-wrap';
      holder.appendChild(sw);
      sw.addEventListener('click', () => {
        sel[r.key] = hex;
        sec.querySelectorAll('.sw').forEach(s => s.classList.remove('sel'));
        sw.classList.add('sel');
        apply();
      });
      if (sel[r.key] === hex) sw.classList.add('sel');
      wrap.appendChild(holder);
    });
    rolesEl.appendChild(sec);
  });

  document.getElementById('copy').addEventListener('click', async () => {
    const txt = document.getElementById('out').textContent;
    try { await navigator.clipboard.writeText(txt);
      document.getElementById('copy-hint').textContent = 'Скопировано! Вставьте в чат.';
    } catch(e){
      document.getElementById('copy-hint').textContent = 'Не удалось — скопируйте вручную: ' + txt;
    }
  });

  apply();
</script>
</body>
</html>
